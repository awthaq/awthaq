# zizmor configuration (https://docs.zizmor.sh/configuration/).
#
# MM-006: every third-party action must be pinned to a full commit SHA (with a
# version comment), in every workflow, not only the ones that happened to be
# written that way. zizmor's default policy accepts a tag; this makes it an error.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
