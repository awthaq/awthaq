version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # MM-003: the patched compiler pair (`@effect/tsgo` patches the installed
      # `typescript` in `prepare`) must move together. Listed first so these win
      # over the broader `@effect/*` pattern of the `effect` group below.
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@effect/tsgo"
          - "@effect/language-service"
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      qadi:
        patterns:
          - "@qadi/*"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
