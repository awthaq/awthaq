# Shipping-gap map (.scratch/shipping-gaps), ticket 28: wired per
# spec/process/definitions-of-done.md's gate 12 (npm trusted publishing via
# OIDC, no long-lived tokens, Sigstore provenance attached automatically) —
# not run as part of this ticket. Every `@effect-auth/*` package is still
# `"private": true`, so `changeset publish` has nothing publishable yet;
# this workflow only becomes live once a package is made public and the
# npm registry has a trusted publisher configured for this repository and
# this workflow file (Settings -> Trusted publishers, on npmjs.com), which
# is manual, out-of-band setup no agent can do from here.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # OIDC trusted publishing — npm exchanges this token for a short-lived
  # publish credential; no NPM_TOKEN secret is stored anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: pnpm
          # npm 11.5.1+ is required for OIDC trusted publishing.
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version or publish
        uses: changesets/action@v1
        with:
          # Runs `pnpm changeset publish` once changesets have been
          # versioned and merged; otherwise opens/updates a "Version
          # Packages" pull request. No npm token input — publishing
          # authenticates via OIDC (`id-token: write` above).
          publish: pnpm changeset-publish
          version: pnpm changeset-version
          commit: "chore: version packages"
          title: "chore: version packages"
