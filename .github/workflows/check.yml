name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: ["22.12.0"]
    # Shipping-gap map (.scratch/shipping-gaps), ticket 15: a real Postgres
    # service so packages/sql's Repositories.postgres.test.ts (skipped
    # locally without EFFECT_AUTH_POSTGRES_URL) actually runs here, not
    # silently — the exact failure mode the map's own spec flagged in
    # upstream's own live-PG test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: effect_auth
          POSTGRES_PASSWORD: effect_auth
          POSTGRES_DB: effect_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EFFECT_AUTH_POSTGRES_URL: postgres://effect_auth:effect_auth@localhost:5432/effect_auth_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
