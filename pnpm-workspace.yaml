packages:
  - packages/*
  - features
  # Upstream-hardening map, ticket 09: runnable examples, additional to
  # (never a replacement for) the README's own single-plugin Postgres
  # quickstart.
  - examples/*

# `effect` is pinned exact, not a caret range, and (once packages exist) every
# @awthaq package is expected to publish that exact pin as its own
# runtime dependency, the same discipline qadi (../qadi) follows. This is
# deliberate for as long as effect ships as an rc: two different rc builds
# are not guaranteed ABI-compatible the way two semver-compatible stable
# releases are, so a resolution conflict on mismatch should be loud, not
# silent. Revisit once effect 4.0.0 ships stable.
catalog:
  effect: 4.0.0-rc.116
  "@effect/platform-node": 4.0.0-rc.116
  "@effect/sql-sqlite-node": 4.0.0-rc.116
  "@effect/sql-pg": 4.0.0-rc.116
  "@effect/sql-libsql": 4.0.0-rc.116
  "@effect/vitest": 4.0.0-rc.116
  "@effect/atom-react": 4.0.0-rc.116
  vitest: 5.0.2
  "@vitest/coverage-v8": 5.0.2
  # Exact, like `@effect/tsgo` below: `effect-tsgo patch` (the root `prepare`) patches the
  # installed typescript binary for one specific pairing, so a caret range here could
  # drift the pair apart on a lockfile refresh (MM-003). Bump both together.
  typescript: 7.0.2
  "@effect/tsgo": 0.46.1
  "@types/node": ^22.12.0
  hash-wasm: ^4.12.0
  # Same versions qadi's own root catalog (../qadi/pnpm-workspace.yaml) pins
  # for its @qadi/react package — kept identical so both repos exercise one
  # real, matching React version rather than two independently-drifting ones.
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@testing-library/react": ^16.3.2
  happy-dom: ^20.11.1

minimumReleaseAgeExclude:
  - "@effect-cucumber/gherkin@0.10.1"
  - "@effect-cucumber/vitest@0.10.1"
  - "@effect/platform-node-shared@4.0.0-rc.116"
  - "@effect/platform-node@4.0.0-rc.116"
  - "@effect/sql-sqlite-node@4.0.0-rc.116"
  - "@effect/sql-pg@4.0.0-rc.116"
  - "@effect/sql-libsql@4.0.0-rc.116"
  - "@effect/vitest@4.0.0-rc.116"
  - effect@4.0.0-rc.116
  - "@effect/atom-react@4.0.0-rc.116"
  - "@qadi/core@0.8.0"
  - "@qadi/http@0.8.0"
  - "@qadi/react@0.8.0"
