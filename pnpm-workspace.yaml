packages:
  - packages/*
  - features
  # Upstream-hardening map, ticket 09: runnable examples, additional to
  # (never a replacement for) the README's own single-plugin Postgres
  # quickstart.
  - examples/*

# Two catalogs, the same model qadi (../qadi/pnpm-workspace.yaml) uses:
#
# - `catalog:` is what this repository develops and tests against. Ranges, not exact pins:
#   `pnpm-lock.yaml` is what makes an install reproducible (`pnpm update -r effect ...` moves it).
# - `catalogs.peer` is what published @awthaq packages ask the host for. effect, @effect/*, qadi
#   and React are *peer* dependencies, never runtime ones: awthaq's public API is made of their
#   classes (`Context.Service`, `Data.TaggedError`, Schema, `HttpApiGroup`), so a second copy in
#   the host's tree would be a silent type and identity mismatch, not a loud failure. `pnpm pack`
#   writes `catalog:peer` verbatim into the tarball, so this catalog holds ranges only — an exact
#   pin here would strand every consumer on one build. Each package also lists the same names
#   under `devDependencies` (`catalog:`) so this repository's own builds and tests resolve them.
#
# The effect floor is the minor this code is built and tested against. effect 4.1 still tags
# its http, http-api, sql and crypto modules `@stability unstable`, so a later 4.x minor can
# change them; when it does, this range is where the supported window is narrowed or moved.
catalog:
  effect: ^4.1.2
  "@effect/platform-node": ^4.1.2
  "@effect/sql-sqlite-node": ^4.1.2
  "@effect/sql-pg": ^4.1.2
  "@effect/sql-libsql": ^4.1.2
  "@effect/vitest": ^4.1.2
  "@effect/atom-react": ^4.1.2
  "@qadi/core": ^0.12.0
  "@qadi/http": ^0.12.0
  "@qadi/react": ^0.12.0
  vitest: 5.0.2
  "@vitest/coverage-v8": 5.0.2
  # Exact, like `@effect/tsgo` below: `effect-tsgo patch` (the root `prepare`) patches the
  # installed typescript binary for one specific pairing, so a caret range here could
  # drift the pair apart on a lockfile refresh (MM-003). Bump both together.
  typescript: 7.0.2
  "@effect/tsgo": 0.63.0
  "@types/node": ^22.20.4
  hash-wasm: ^4.12.0
  # Same versions qadi's own root catalog (../qadi/pnpm-workspace.yaml) pins
  # for its @qadi/react package — kept identical so both repos exercise one
  # real, matching React version rather than two independently-drifting ones.
  react: 19.3.0
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@testing-library/react": ^16.3.2
  happy-dom: ^20.14.6

# Ranges only (see the comment above `catalog:`): what a published package's `peerDependencies`
# ask the host for.
catalogs:
  peer:
    effect: ^4.1.0
    "@effect/platform-node": ^4.1.0
    "@effect/sql-sqlite-node": ^4.1.0
    "@effect/sql-pg": ^4.1.0
    "@effect/atom-react": ^4.1.0
    "@qadi/core": ^0.12.0
    "@qadi/http": ^0.12.0
    "@qadi/react": ^0.12.0

minimumReleaseAgeExclude:
  - "@effect-cucumber/gherkin@0.10.1"
  - "@effect-cucumber/vitest@0.10.1"
  - "@qadi/core@0.12.0"
  - "@qadi/http@0.12.0"
  - "@qadi/react@0.12.0"
